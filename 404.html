<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Briskware</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages serves this file for any unknown path, so asset links are root-absolute. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f6f6f0; --fg: #1c1d16; --muted: #55574a; --brand: #808000; --btn: #6b6b00; --on-btn: #fff; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17180f; --fg: #ecece3; --muted: #a8aa96; --brand: #a5a51e; --btn: #a5a51e; --on-btn: #17180f; color-scheme: dark; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           background: var(--bg); color: var(--fg); font: 17px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif; text-align: center; }
    .code { font-size: 96px; font-weight: 600; line-height: 1; color: var(--brand); letter-spacing: -0.02em; }
    h1 { font-size: 26px; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 28px; }
    a { display: inline-block; padding: 12px 20px; border-radius: 8px; background: var(--btn); color: var(--on-btn); text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be out of date, or the address may have a typo.</p>
    <a href="/">Go to briskware.eu</a>
  </main>
</body>
</html>
